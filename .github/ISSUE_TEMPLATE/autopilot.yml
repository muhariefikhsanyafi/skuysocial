name: Development task
description: Queue a scoped Development task after owner approval
# Intake also requires owner authorship and the manually applied autopilot-approved label.
title: "[Autopilot] "
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the change. Never paste secrets or Production credentials.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable outcomes and affected flows.
    validations:
      required: true
