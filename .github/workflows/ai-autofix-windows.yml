name: SkuySocial AI Auto-Fix (Windows)
# GitHub starts this workflow when owned-PR quality checks fail.
# IMPORTANT: workflow_run becomes active only after this reviewed file reaches main.
on:
  workflow_run:
    workflows: [SkuySocial Quality, SkuySocial CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: windows-autofix-${{ github.event.workflow_run.head_branch }
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.gate.outputs.sha }
      branch: ${{ steps.gate.outputs.branch }
      number: ${{ steps.gate.outputs.number }
    steps:
      - name: Verify repository, author, draft PR and unchanged head
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          payload = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          run = payload['workflow_run']
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'muhariefikhsanyafi/skuysocial' or run['event'] != 'pull_request':
              raise RuntimeError('Untrusted workflow source')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def get(url):
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  return json.load(response)
          candidates = [int(item['number']) for item in run.get('pull_requests', [])]
          if not candidates:
              candidates = [int(item['number']) for item in
                            get('https://api.github.com/repos/' + repo + '/commits/' +
                                run['head_sha'] + '/pulls?per_page=20')]
          if len(set(candidates)) != 1:
              raise RuntimeError('No unique pull request associated with failed checks')
          number = candidates[0]
          pr = get('https://api.github.com/repos/' + repo + '/pulls/' + str(number))
          branch, sha = pr['head']['ref'], pr['head']['sha']
          if (pr['state'] != 'open' or not pr['draft'] or
              pr['user']['login'] != 'muhariefikhsanyafi' or
              pr['base']['repo']['full_name'] != repo or
              pr['head']['repo']['full_name'] != repo or
              sha != run['head_sha'] or branch != run['head_branch'] or
              not re.fullmatch(r'(?:feat|codex)/[A-Za-z0-9._/-]+', branch) or
              '..' in branch or '//' in branch):
              raise RuntimeError('PR is not eligible for autonomous repair')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('number=' + str(number) + '\n')
              output.write('sha=' + sha + '\n')
              output.write('branch=' + branch + '\n')
          print('Verified owner-controlled Draft PR #', number)
          PY

  repair:
    needs: verify
    if: ${{ needs.verify.result == 'success' }
    # Dedicated Windows account, never personal Windows or Production credentials.
    runs-on: [self-hosted, windows, x64, skuysocial-autofix]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout verified SHA without GitHub token persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }
          persist-credentials: false
          fetch-depth: 2
          path: source
      - name: Run Codex through local 9Router and publish guarded fix
        shell: powershell
        working-directory: source
        env:
          FIX_PR: ${{ needs.verify.outputs.number }
          FIX_BRANCH: ${{ needs.verify.outputs.branch }
          FIX_SHA: ${{ needs.verify.outputs.sha }
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }
          GIT_TERMINAL_PROMPT: '0'
        run: |
          & "$env:GITHUB_WORKSPACE\source\ops\autopilot\windows\repair-failed-ci.ps1"
