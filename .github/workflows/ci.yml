name: SkuySocial CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/modern-social-feed-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secrets and private-file guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked private files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [part.decode("utf-8", "surrogateescape") for part in raw.split(b"\0") if part]
          forbidden = []
          for path in paths:
              name = pathlib.PurePosixPath(path).name.lower()
              env_file = name == ".env" or (name.startswith(".env.") and name != ".env.example")
              key_file = name in {"id_ed25519", "id_rsa", "auth.json"} or name.endswith((".pem", ".p12", ".pfx"))
              data_file = name.endswith((".sqlite", ".sqlite3", ".db", ".dump", ".sql.gz"))
              if env_file or key_file or data_file:
                  forbidden.append(path)
          if forbidden:
              print("BLOCKED: tracked files match private-file policies.")
              for path in forbidden:
                  print(" -", path)
              sys.exit(1)
          print("PASS: no tracked private-file names.")
          PY

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.11'
          cache: false

      - name: Install pinned Gitleaks
        shell: bash
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan Git history and working tree (redacted)
        shell: bash
        run: |
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" git --redact --no-banner --exit-code 1 .
          "$GITLEAKS" dir --redact --no-banner --exit-code 1 .

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:client

      - name: Build frontend assets
        run: npm run build

  backend:
    name: Laravel PHPUnit (isolated SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      ONESIGNAL_ENABLED: 'false'
      TURNSTILE_ENABLED: 'false'
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, intl, gd, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none
        env:
          fail-fast: 'true'

      - name: Set up Node.js to build Blade/Vite manifest
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Vite manifest required by Blade tests
        run: npm run build

      - name: Create untracked empty dotenv placeholder for isolated tests
        shell: bash
        run: |
          if [ -e .env ] || git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'BLOCKED: unexpected .env file in CI checkout'
            exit 1
          fi
          : > .env

      - name: Generate and mask ephemeral CI-only encryption key
        shell: bash
        run: |
          php -r '$key = "base64:".base64_encode(random_bytes(32)); fwrite(STDOUT, "::add-mask::".$key.PHP_EOL); file_put_contents(getenv("GITHUB_ENV"), "APP_KEY=".$key.PHP_EOL, FILE_APPEND);'

      - name: Run Laravel tests
        run: php artisan test --no-ansi

      - name: Verify Tailwind v4 UI in isolated Chromium
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/tailwind-v4-migration-20261015'
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo 'Browser compatibility verification unavailable: no Chromium executable'
            exit 1
          fi
          node tests/Browser/theme-navigation.mjs --phase=after --browser="$BROWSER" --output="$RUNNER_TEMP/skuy-tailwind-v4-browser"

      - name: Remove untracked CI-only dotenv placeholder
        if: always()
        run: rm -f -- .env

  dependency-audit:
    name: Dependency security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer advisory audit (lockfile only)
        run: composer audit --locked --no-interaction

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: npm audit blocks high and critical advisories (including dev dependencies)
        if: always()
        run: npm audit --audit-level=high

      - name: Block high-risk runtime dependency advisories
        if: always()
        run: npm audit --omit=dev --audit-level=high

      - name: Report remaining npm advisories by severity
        if: always()
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-report.json" || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit-report.json', 'utf8'));
          if (!report.metadata?.vulnerabilities) {
            throw new Error('Unable to retrieve advisory counts; review dependency audit logs');
          }
          const {critical = 0, high = 0, moderate = 0, low = 0} = report.metadata.vulnerabilities;
          console.log('npm audit totals: critical=' + critical + ', high=' + high + ', moderate=' + moderate + ', low=' + low);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### npm advisory visibility\\n' +
            '- Critical: ' + critical + '\\n' +
            '- High: ' + high + '\\n' +
            '- Moderate: ' + moderate + '\\n' +
            '- Low: ' + low + '\\n\\n' +
            'Runtime: block high+ via npm audit --omit=dev. Build-time: block high or critical. Remaining development advisories require Tailwind 4 compatibility review.\\n');
          if (high > 0 || moderate > 0) {
            console.log('::warning title=Build-time dependency advisories::Non-critical npm findings remain; see job summary.');
          }
          JS
