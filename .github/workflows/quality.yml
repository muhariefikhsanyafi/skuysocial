name: SkuySocial Quality
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      ONESIGNAL_ENABLED: 'false'
      TURNSTILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite, intl, zip, gd, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without application setup scripts
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          npm ci --ignore-scripts
      - name: Runner and deployment safety tests
        run: python3 -m unittest discover -s ops/autopilot/tests -v
      - name: Laravel, frontend, types, build, smoke, and artifact gates
        run: python3 ops/autopilot/quality.py --all --output autopilot-artifacts/quality
      - name: Package validated source and assets
        run: python3 ops/deploy/release.py pack --output autopilot-artifacts/release
      - name: Publish failure summary
        if: always()
        run: |
          python3 ops/autopilot/ci_summary.py autopilot-artifacts/quality >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: application-qa-${{ github.sha }}
          path: autopilot-artifacts/
          retention-days: 14
          if-no-files-found: warn
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --no-interaction
      - run: npm audit --package-lock-only --audit-level=high
      - run: python3 ops/autopilot/security_check.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite, intl, zip, gd
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Real isolated theme and navigation rendering
        run: |
          browser_path=$(command -v google-chrome || command -v chromium)
          test -n "$browser_path"
          mkdir -p autopilot-artifacts/browser
          # Run Chromium directly, as in the passing SkuySocial CI backend job.
          # The generic Codex subprocess wrapper applies a 32 MiB per-file limit
          # to browser descendants, which can stall Chromium screenshots.
          timeout --signal=TERM --kill-after=15s 12m \
            node tests/Browser/theme-navigation.mjs \
              --phase=after --php="$(command -v php)" --browser="$browser_path" \
              --output=autopilot-artifacts/browser
          test -s autopilot-artifacts/browser/after/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-qa-${{ github.sha }}
          path: autopilot-artifacts/browser/
          retention-days: 7
  release-gate:
    needs: [application, security, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'All quality gates passed. Production auto-deploy remains DISABLED.' >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Immediate PR quality status
    # Isolated API-only job: no checkout, no execution of PR code with write credentials.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'muhariefikhsanyafi' }}
    needs: [application, security, browser, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      RESULT_APPLICATION: ${{ needs.application.result }}
      RESULT_SECURITY: ${{ needs.security.result }}
      RESULT_BROWSER: ${{ needs.browser.result }}
      RESULT_RELEASE: ${{ needs.release-gate.result }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Upsert PR status on every test completion
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          pr_number = int(os.environ['PR_NUMBER'])
          if pr_number < 1 or repo != 'muhariefikhsanyafi/skuysocial':
              raise RuntimeError('Unexpected PR target')
          results = {key: os.environ['RESULT_' + key] for key in (
              'APPLICATION', 'SECURITY', 'BROWSER', 'RELEASE')}
          if any(value not in {'success', 'failure', 'cancelled', 'skipped'} for value in results.values()):
              raise RuntimeError('Unexpected GitHub job status')
          passing = all(value == 'success' for value in results.values())
          marker = '<!-- skuysocial-quality-event-v1 -->'
          url = 'https://github.com/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          body = (
              marker + '\n' +
              '**SkuySocial Quality: ' + ('PASS' if passing else 'CHECKS NOT GREEN') + '**\n\n' +
              '\n'.join('- ' + key.capitalize() + ': **' + value + '**'
                        for key, value in results.items()) +
              '\n\n[Detail GitHub Actions](' + url + ')\n\n'
              'Production deployment remains disabled. PR is not auto-merged.'
          )
          api = 'https://api.github.com/repos/' + repo + '/issues/' + str(pr_number) + '/comments'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skuysocial-quality-event',
          }
          def call(url, method='GET', data=None):
              request = Request(url, data=json.dumps(data).encode() if data is not None else None,
                                method=method,
                                headers={**headers, **({'Content-Type': 'application/json'} if data is not None else {})})
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          # Keep one updateable comment per PR rather than spamming on every commit.
          existing = None
          page = 1
          while page <= 5:
              comments = call(api + '?per_page=100&page=' + str(page))
              for item in comments:
                  if (item.get('user', {}).get('login') == 'github-actions[bot]' and
                          item.get('body', '').startswith(marker)):
                      existing = item
                      break
              if existing or len(comments) < 100:
                  break
              page += 1
          if existing:
              call(existing['url'], 'PATCH', {'body': body})
              print('Updated existing PR quality status comment.')
          else:
              call(api, 'POST', {'body': body})
              print('Created PR quality status comment.')
          print('Quality state:', 'PASS' if passing else 'CHECKS NOT GREEN')
          PY
